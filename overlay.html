<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<title>Estúdio 4blue — overlay</title>
<link rel="stylesheet" href="base.css">
<style>
  .logo{position:absolute;top:22px;left:40px;height:46px;transition:opacity .4s}
  body.black .logo{content:url(assets/logo-black.png);height:58px;top:14px}

  /* banner com nome de quem fala */
  .banner{position:absolute;left:60px;bottom:84px;display:flex;flex-direction:column;align-items:flex-start;
    transform:translateX(calc(-100% - 90px));opacity:0;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .4s}
  .banner.on{transform:none;opacity:1}
  .banner .nome{background:var(--faixa);padding:14px 30px 10px;font-size:58px;border-radius:14px 14px 14px 0;
    box-shadow:0 10px 30px rgba(0,0,0,.35)}
  body.black .banner .nome{border:2px solid #C8963A}
  body.black .banner .nome span{background:var(--ouro);-webkit-background-clip:text;color:transparent}
  .banner .cargo{background:var(--claro);color:var(--marinho);font-weight:700;font-size:24px;padding:10px 30px;border-radius:0 0 14px 14px}
  body.black .banner .cargo{background:var(--ouro);color:#111}
  .banner .cargo:empty{display:none}
  .banner .nome:has(+ .cargo:empty){border-radius:14px}

  /* letreiro */
  .letreiro{position:absolute;left:0;right:0;bottom:0;height:56px;background:var(--faixa2);display:flex;align-items:center;
    overflow:hidden;transform:translateY(100%);transition:transform .5s}
  .letreiro.on{transform:none}
  .letreiro .tag{flex:none;height:100%;display:flex;align-items:center;padding:0 26px;background:var(--destaque);color:#0b1b33;
    font-weight:900;font-size:22px;letter-spacing:.12em;text-transform:uppercase;z-index:1}
  .letreiro .trilho{white-space:nowrap;font-weight:700;font-size:26px;padding-left:40px;animation:rola linear infinite}
  @keyframes rola{from{transform:translateX(1920px)}to{transform:translateX(-100%)}}

  /* comentário em destaque */
  .coment{position:absolute;right:60px;bottom:84px;width:720px;display:flex;gap:20px;align-items:flex-start;
    background:rgba(255,255,255,.97);color:#0b1b33;border-radius:22px;padding:24px 28px;box-shadow:0 14px 40px rgba(0,0,0,.35);
    border-left:10px solid var(--azul);opacity:0;transform:translateY(30px) scale(.97);transition:all .5s cubic-bezier(.2,.8,.2,1)}
  body.black .coment{background:#141414;color:#fff;border-left-color:#E8C26A}
  .coment.on{opacity:1;transform:none}
  .coment img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;background:#ccd}
  .coment img[src=""]{display:none}
  .coment .quem{font-weight:800;font-size:24px;color:var(--azul);margin-bottom:6px}
  body.black .coment .quem{color:#E8C26A}
  .coment .msg{font-weight:600;font-size:30px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}

  /* chamada com QR */
  .cta{position:absolute;right:30px;top:360px;width:420px;background:var(--faixa);border-radius:22px;padding:26px;text-align:center;
    box-shadow:0 14px 40px rgba(0,0,0,.35);opacity:0;transform:translateX(60px);transition:all .6s cubic-bezier(.2,.8,.2,1)}
  body.black .cta{background:#0d0d0d;border:2px solid #C8963A}
  .cta.on{opacity:1;transform:none}
  .cta .t{font-size:54px;margin-bottom:10px}
  body.black .cta .t{background:var(--ouro);-webkit-background-clip:text;color:transparent}
  .cta .x{font-weight:700;font-size:22px;line-height:1.35;margin-bottom:18px}
  .cta .qr{background:#fff;border-radius:14px;padding:14px;display:inline-block}
  .cta .qr:empty{display:none}
  .cta .qr img,.cta .qr canvas{display:block;width:240px;height:240px;image-rendering:pixelated}
  .cta .l{margin-top:14px;font-weight:800;font-size:20px;color:var(--destaque);word-break:break-all}
</style></head>
<body>
<img class="logo" id="logo" src="assets/logo-4blue-branca.png" alt="">
<div class="banner" id="banner"><div class="nome ko"><span id="bnome"></span></div><div class="cargo" id="bcargo"></div></div>
<div class="coment" id="coment"><img id="cfoto" src="" alt=""><div><div class="quem" id="cquem"></div><div class="msg" id="cmsg"></div></div></div>
<div class="cta" id="cta"><div class="t ko" id="ctat"></div><div class="x" id="ctax"></div><div class="qr" id="ctaqr"></div><div class="l" id="ctal"></div></div>
<div class="letreiro" id="letreiro"><div class="tag" id="ltag">Ao vivo</div><div class="trilho" id="ltxt"></div></div>

<script src="estado.js"></script>
<script async src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.min.js" onload="window.qrPronto&&qrPronto()"></script>
<script>
const $=id=>document.getElementById(id);
let ultimoQR='',ultimoLetreiro='',ultimoComent='';
function desenhar(e){
  const b=e.banner||{},l=e.letreiro||{},c=e.comentario||{},k=e.cta||{};
  $('logo').style.opacity=e.logo===false?0:1;

  $('bnome').textContent=b.nome||''; $('bcargo').textContent=b.cargo||'';
  $('banner').classList.toggle('on',!!(b.visivel&&b.nome));

  $('ltag').textContent=l.tag||'Ao vivo';
  if(l.texto!==ultimoLetreiro){
    ultimoLetreiro=l.texto||'';
    const tr=$('ltxt'); tr.textContent=ultimoLetreiro;
    // velocidade constante (~140 px/s) independente do tamanho do texto
    requestAnimationFrame(()=>{tr.style.animationDuration=((1920+tr.scrollWidth)/140)+'s'});
  }
  $('letreiro').classList.toggle('on',!!(l.visivel&&l.texto));

  const chaveC=(c.nome||'')+'|'+(c.texto||'');
  const mostrar=()=>{
    $('cquem').textContent=c.nome||''; $('cmsg').textContent=c.texto||''; $('cfoto').src=c.foto||'';
    $('coment').classList.toggle('on',!!(c.visivel&&c.texto));
  };
  if(chaveC!==ultimoComent && $('coment').classList.contains('on') && c.visivel){
    // troca de comentário: sai e entra de novo
    $('coment').classList.remove('on'); setTimeout(mostrar,450);
  } else mostrar();
  ultimoComent=chaveC;

  $('ctat').textContent=k.titulo||''; $('ctax').textContent=k.texto||''; $('ctal').textContent=k.linkTexto||'';
  if((k.link||'')!==ultimoQR){
    ultimoQR=k.link||''; $('ctaqr').innerHTML='';
    if(ultimoQR&&window.qrcode){const q=qrcode(0,'M');q.addData(ultimoQR);q.make();$('ctaqr').innerHTML=q.createImgTag(8,0)}
  }
  $('cta').classList.toggle('on',!!(k.visivel&&(k.titulo||k.link)));
}
Estudio.aoMudar(desenhar);
window.qrPronto=()=>{ultimoQR=null;desenhar(Estudio.estado)};
</script>
</body></html>
